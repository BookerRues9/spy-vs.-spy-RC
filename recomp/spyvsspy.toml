# PS2Recomp config for Spy vs. Spy (PAL, SLES-53078).
# scripts/regenerate.ps1 fills in @ELF@, @OUT@ and @CSV@ with absolute paths.
# With this file, recomp/functions.csv, tools/fix_sqrt.py and tools/compact_register.py
# the generated code is byte-for-byte identical to the one this port was built with.

[general]
# Path to input ELF file
input = "@ELF@"

# Path to Ghidra exported function map (optional CSV)
ghidra_output = "@CSV@"

# Path to output directory
output = "@OUT@"

# Single file output mode (recommended for large games)
single_file_output = false

# Patch policy (instruction-driven handling is preferred for syscalls)
patch_syscalls = false
patch_cop0 = true
patch_cache = true

